{% extends "base.html" %}
{% block title %}Editar capacitación{% endblock %}

{% block content %}
<div class="flex-1 overflow-y-auto p-4 sm:p-6" x-data="{ visibility: {{ (t.status if t.status in ('employee', 'department', 'custom') else '') | tojson | forceescape }}, deptId: {{ (t.department_id | string if t.department_id else '') | tojson | forceescape }}, filter: '', picked: {{ selected_ids | length }} }">
  <div class="max-w-2xl mx-auto">
    <div class="mb-6">
      <h1 class="text-xl font-bold text-gray-900">Editar capacitación</h1>
      <p class="text-sm text-gray-500 mt-1">{{ t.department.name if t.department else "" }}</p>
    </div>

    <form method="post" action="/trainings/{{ t.id }}/edit"
          @submit="if (visibility === 'custom' && !picked) { $event.preventDefault(); alert('Selecciona al menos una persona.'); }"
          class="bg-white rounded-xl border border-gray-200 p-6 space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Título <span class="text-red-500">*</span></label>
        <input type="text" name="title" required maxlength="255" value="{{ t.title }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500" />
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
        <textarea name="description" rows="4"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-blue-500 resize-none">{{ t.description or "" }}</textarea>
      </div>

      {% set edit_mode = true %}
      {% include "trainings/_scope_fields.html" %}

      <div class="flex gap-3 pt-2">
        <button type="submit" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium">Guardar</button>
        <a href="/trainings/{{ t.id }}" class="px-4 py-2.5 border border-gray-300 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-50">Cancelar</a>
      </div>
    </form>
  </div>
</div>
<style>[x-cloak] { display: none !important; }</style>
{% endblock %}
