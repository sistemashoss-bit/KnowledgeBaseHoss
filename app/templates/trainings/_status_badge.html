{#- Visibilidad de una capacitación (mismos colores que documentos). Recibe `t`. -#}
{% if t.status == "public" %}
<span class="px-2 py-0.5 rounded-full bg-green-50 border border-green-100 text-green-700 text-[11px] font-medium">Público</span>
{% elif t.status == "employee" %}
<span class="px-2 py-0.5 rounded-full bg-blue-50 border border-blue-100 text-blue-700 text-[11px] font-medium">Empleados</span>
{% else %}
<span class="px-2 py-0.5 rounded-full bg-violet-50 border border-violet-100 text-violet-700 text-[11px] font-medium">Personas específicas</span>
{% endif %}
