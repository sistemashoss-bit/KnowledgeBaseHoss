{#- Visibilidad de una capacitación. Recibe `t`. -#}
{% if t.status == "employee" %}
<span class="px-2 py-0.5 rounded-full bg-blue-50 border border-blue-100 text-blue-700 text-[11px] font-medium">Toda la empresa</span>
{% elif t.status == "department" %}
<span class="px-2 py-0.5 rounded-full bg-amber-50 border border-amber-100 text-amber-700 text-[11px] font-medium">Solo {{ t.department.name if t.department else "el departamento" }}</span>
{% else %}
<span class="px-2 py-0.5 rounded-full bg-violet-50 border border-violet-100 text-violet-700 text-[11px] font-medium">Personas específicas</span>
{% endif %}
