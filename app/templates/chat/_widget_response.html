<div class="space-y-1.5">
  <div class="flex gap-2">
    <div class="w-5 h-5 rounded-full bg-gray-100 flex items-center justify-center shrink-0 mt-0.5">
      {% if current_user and current_user.avatar_key %}
      <img src="{{ avatar_url(current_user.avatar_key) }}" alt="Tu foto de perfil"
           class="w-full h-full rounded-full object-cover" />
      {% else %}
      <svg class="w-3 h-3 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      {% endif %}
    </div>
    <p class="text-xs text-gray-500 bg-gray-100 rounded-xl rounded-tl-none px-3 py-2 leading-relaxed max-w-[85%]">
      {{ question }}
    </p>
  </div>

  <div class="flex gap-2 justify-start">
    <div class="w-5 h-5 rounded-full bg-blue-600 flex items-center justify-center shrink-0 mt-0.5">
      <img src="{{ url_for('assets', path='mascota.png') }}" alt="MAX"
           class="w-full h-full rounded-full object-contain" />
    </div>
    <div class="max-w-[85%] space-y-1.5">
      <p class="text-xs text-gray-800 bg-blue-50 rounded-xl rounded-tl-none px-3 py-2 leading-relaxed">
        {{ answer | replace('\n', '<br>') | safe }}
      </p>
      {% if sources %}
      <div class="flex flex-wrap gap-1 px-1">
        {% for source in sources %}
        <a href="/documents/{{ source.id }}/view"
           target="_blank" rel="noopener"
           class="text-xs text-blue-600 bg-white border border-blue-200 hover:bg-blue-50 px-2 py-0.5 rounded-full transition-colors truncate max-w-[140px]">
          {{ source.title }}
        </a>
        {% endfor %}
      </div>
      {% endif %}
    </div>
  </div>
</div>
