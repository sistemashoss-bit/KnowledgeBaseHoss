{% extends "base.html" %}
{% block title %}Calendario{% endblock %}

{% block content %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/es.global.min.js"></script>
<link rel="stylesheet" href="{{ asset('calendar/calendar.css') }}" />

<div class="flex-1 overflow-y-auto p-4 sm:p-6" x-data="calendarPage()">
  <div class="mx-auto grid w-full max-w-none gap-4 lg:grid-cols-[16rem_minmax(0,1fr)]">

    {% include "calendar/_side_panel.html" %}

    <!-- Calendario -->
    <section class="bg-white rounded-xl border border-gray-200 p-3 sm:p-4 min-w-0 h-[90vh] overflow-y-auto">
      <div id="calendar" x-ref="calendar"></div>
    </section>
  </div>

  <!-- Tooltip (hover, solo con mouse) -->
  <div x-show="tip" x-cloak role="tooltip"
       class="fixed z-[70] w-72 max-w-[calc(100vw-2rem)] bg-white border border-gray-200 rounded-lg shadow-lg p-3 pointer-events-none"
       :style="`left:${tipX}px; top:${tipY}px`">
    <template x-if="tip">
      <div x-effect="$el.replaceChildren(detailNodes(tip))"></div>
    </template>
  </div>

  {% include "calendar/_detail_modal.html" %}

  {% include "calendar/_form_modal.html" %}
</div>

<script>
  const CAL_REMINDERS = {{ reminder_options | tojson }};
  const CAL_INITIAL_DATE = {{ initial_date | tojson }};
  const CAL_INITIAL_EVENT = {{ initial_event | tojson }};
  // "Programar reunión" desde un chat: {title, invite: [ids]} o null.
  const CAL_INITIAL_MEETING = {{ initial_meeting | tojson }};
  const CAL_ME = {{ current_user.id | string | tojson }};
</script>
<script src="{{ asset('calendar/calendar.js') }}"></script>
{% endblock %}
