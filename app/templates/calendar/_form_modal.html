{# Formulario crear / editar evento o reunión; usa el estado Alpine de calendarPage(). Se incluye desde calendar/index.html. #}
{% import "tasks/_share_picker.html" as sharing %}
  <!-- Formulario crear / editar -->
  <div x-show="form" x-cloak class="fixed inset-0 z-[75] flex items-center justify-center bg-black/40 p-4"
       @keydown.escape.window="form = null">
    <form id="cal-event-form" x-show="form" @submit.prevent="saveForm()" class="responsive-modal bg-white rounded-xl shadow-xl w-full max-w-lg p-5 space-y-3"
          role="dialog" aria-modal="true" aria-labelledby="cal-form-title">
      <template x-if="form">
        <div class="space-y-3">
          <h2 id="cal-form-title" class="text-lg font-semibold text-gray-900" x-text="form.isMeeting ? (form.id ? 'Editar reunión' : 'Nueva reunión') : (form.id ? 'Editar evento' : 'Nuevo evento')"></h2>

          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Título <span class="text-red-500">*</span></label>
            <input type="text" x-model="form.title" required maxlength="255"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>

          <label class="flex items-start gap-2 text-sm text-gray-700">
            <input type="checkbox" x-model="form.isMeeting" @change="if (form.isMeeting) { form.allDay = false; if (form.reminder === '' || form.reminder === '15') form.reminder = '10'; }"
                   class="mt-0.5 rounded border-gray-300 text-blue-600" />
            <span>
              Reunión con videollamada
              <span class="block text-[11px] text-gray-400">Los invitados la ven en su calendario, confirman asistencia y entran a la sala desde el evento.</span>
            </span>
          </label>

          <label class="flex items-center gap-2 text-sm text-gray-700" x-show="!form.isMeeting">
            <input type="checkbox" x-model="form.allDay" @change="fixReminder()" class="rounded border-gray-300 text-blue-600" />
            Todo el día
          </label>

          <!-- Con repetición cada ocurrencia es de un solo día: se pide la fecha
               (la primera) y el horario; el fin de la serie va en "Hasta". -->
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-600 mb-1" x-text="form.repeat ? 'Primera fecha' : 'Inicio'"></label>
              <input type="date" x-model="form.startDate" required @change="syncEndDate()"
                     class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
              <input type="time" x-model="form.startTime" x-show="!form.allDay" :required="!form.allDay"
                     class="w-full mt-1 px-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
            </div>
            <div x-show="!(form.repeat && form.allDay)">
              <label class="block text-xs font-medium text-gray-600 mb-1" x-text="form.repeat ? 'Hora de fin' : 'Fin'"></label>
              <input type="date" x-model="form.endDate" x-show="!form.repeat" required :min="form.startDate"
                     class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
              <input type="time" x-model="form.endTime" x-show="!form.allDay" :required="!form.allDay"
                     class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm" :class="form.repeat ? '' : 'mt-1'" />
            </div>
          </div>

          <div class="space-y-2">
            <label class="flex items-center gap-2 text-sm text-gray-700">
              <input type="checkbox" x-model="form.repeat" @change="if (form.repeat) syncRepeatDefaults(); syncEndDate()" class="rounded border-gray-300 text-blue-600" />
              Repetir
            </label>
            <div x-show="form.repeat" class="space-y-2 pl-6">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1">Frecuencia</label>
                  <select x-model="form.frequency"
                          class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="daily">Diario</option>
                    <option value="weekly">Semanal</option>
                    <option value="monthly">Mensual</option>
                    <option value="custom">Días específicos</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-medium text-gray-600 mb-1">Hasta <span class="text-gray-400">(opcional)</span></label>
                  <input type="date" x-model="form.repeatUntil" :min="form.startDate"
                         class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
                </div>
              </div>
              <div x-show="form.frequency === 'weekly'">
                <label class="block text-xs font-medium text-gray-600 mb-1">Día de la semana</label>
                <select x-model="form.dayOfWeek"
                        class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm bg-white">
                  <template x-for="(d, i) in CAL_WEEKDAYS" :key="i">
                    <option :value="String(i)" x-text="d" :selected="String(i) === String(form.dayOfWeek)"></option>
                  </template>
                </select>
              </div>
              <div x-show="form.frequency === 'custom'">
                <div class="flex items-center justify-between gap-3 mb-1">
                  <label class="block text-xs font-medium text-gray-600">Días de la semana</label>
                  <div class="flex gap-2 text-[11px]">
                    <button type="button" @click="form.daysOfWeek = ['0','1','2','3','4']" class="text-blue-600 hover:underline">Lun–Vie</button>
                    <button type="button" @click="form.daysOfWeek = ['0','2','4']" class="text-blue-600 hover:underline">Lun/Mié/Vie</button>
                  </div>
                </div>
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="(d, i) in CAL_WEEKDAYS_SHORT" :key="i">
                    <label class="inline-flex items-center gap-1 px-2 py-1 border border-gray-300 rounded-lg text-xs cursor-pointer has-[:checked]:bg-blue-50 has-[:checked]:border-blue-400 has-[:checked]:text-blue-700">
                      <input type="checkbox" :value="String(i)" x-model="form.daysOfWeek" class="accent-blue-600" />
                      <span x-text="d"></span>
                    </label>
                  </template>
                </div>
              </div>
              <div x-show="form.frequency === 'monthly'">
                <label class="block text-xs font-medium text-gray-600 mb-1">Día del mes <span class="text-gray-400">(1–31; en meses cortos cae el último día)</span></label>
                <input type="number" x-model="form.dayOfMonth" min="1" max="31" :required="form.repeat && form.frequency === 'monthly'"
                       class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm" />
              </div>
              <p class="text-[11px] text-gray-400" x-text="repeatHint()"></p>
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Color</label>
            <div class="flex flex-wrap gap-2">
              {% for c in colors %}
              <button type="button" @click="form.color = '{{ c }}'"
                      class="w-7 h-7 rounded-full border-2 transition"
                      :class="form.color === '{{ c }}' ? 'border-gray-900 scale-110' : 'border-transparent'"
                      :style="`background:${hex('{{ c }}')}`" title="{{ c }}" aria-label="Color {{ c }}"></button>
              {% endfor %}
            </div>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Recordatorio</label>
            <select x-model="form.reminder"
                    class="w-full px-2 py-1.5 border border-gray-300 rounded-lg text-sm bg-white">
              <option value="">Sin recordatorio</option>
              <template x-for="opt in reminderOptions()" :key="opt.value">
                <option :value="opt.value" x-text="opt.label" :selected="String(opt.value) === String(form.reminder)"></option>
              </template>
            </select>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Ubicación</label>
            <input type="text" x-model="form.location" maxlength="255"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">Descripción</label>
            <textarea x-model="form.description" rows="3"
                      class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">
              <span x-text="form.isMeeting ? 'Invitados' : 'Compartir con'"></span> <span class="text-gray-400">(opcional)</span>
            </label>
            {{ sharing.share_picker(share_candidates, all_departments) }}
            <p class="text-[11px] text-gray-400 mt-1" x-text="form.isMeeting
              ? 'Reciben la invitación, les aparece en su calendario y les llega el recordatorio para unirse.'
              : 'Les aparece en su calendario, pueden comentarlo y reciben sus avisos y recordatorios.'"></p>
          </div>

          <div>
            <label class="block text-xs font-medium text-gray-600 mb-1">
              Adjuntar archivos <span class="text-gray-400">(opcional, máx 50 MB por archivo)</span>
            </label>
            <input type="file" id="cal-form-files" multiple
                   class="block w-full text-sm text-gray-600 file:mr-3 file:px-3 file:py-1.5 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 file:text-xs file:font-medium hover:file:bg-blue-100" />
            <p x-show="form.id" class="text-[11px] text-gray-400 mt-1">Se agregan a los que ya tiene; los actuales se quitan desde el detalle del evento.</p>
          </div>

          <p x-show="error" x-text="error" class="text-sm text-red-600"></p>

          <div class="flex justify-end gap-2 pt-1">
            <button type="button" @click="form = null"
                    class="px-4 py-2 border border-gray-300 text-gray-600 rounded-lg text-sm hover:bg-gray-50">Cancelar</button>
            <button type="submit" :disabled="saving"
                    class="px-4 py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-60 text-white rounded-lg text-sm font-medium">Guardar</button>
          </div>
        </div>
      </template>
    </form>
  </div>
