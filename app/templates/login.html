<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900">
<head>
  <link rel="icon" type="image/png" href="{{ url_for('assets', path='favicon.png').path }}?v=2" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Iniciar sesión — Knowledge Base</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="{{ url_for('assets', path='responsive.css').path }}?v=1" />
</head>
<body class="min-h-full flex items-center justify-center px-4 py-8">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <img src="https://hoss.com.mx/cdn/shop/files/LOGO_FINAL_VARIANTES_Mesa_de_trabajo_1-04_260x.png?v=1674512695"
           alt="HOSS" class="h-12 w-auto object-contain mx-auto brightness-0 invert" />
      <p class="mt-4 text-slate-400 text-sm">Accede con tus credenciales</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 bg-red-500/10 border border-red-500/30 rounded-lg text-red-400 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/auth/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">Correo electrónico</label>
        <input type="email" name="email" required autocomplete="email"
               class="w-full px-3 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 text-sm"
               placeholder="usuario@empresa.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-slate-300 mb-1">Contraseña</label>
        <div class="relative">
          <input id="password" type="password" name="password" required autocomplete="current-password"
                 class="w-full pl-3 pr-12 py-2 bg-slate-800 border border-slate-600 rounded-lg text-white placeholder-slate-400 focus:outline-none focus:border-blue-500 text-sm"
                 placeholder="••••••••" />
          <button id="toggle-password" type="button" aria-controls="password" aria-label="Mostrar contraseña" aria-pressed="false"
                  class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-300 hover:text-white rounded-r-lg focus-visible:outline focus-visible:outline-2 focus-visible:outline-blue-500">
            <svg aria-hidden="true" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" />
              <circle cx="12" cy="12" r="3" />
              <path id="password-eye-slash" d="m3 3 18 18" class="hidden" />
            </svg>
          </button>
        </div>
      </div>

      <button type="submit"
              class="w-full py-2.5 px-4 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-lg transition-colors text-sm">
        Iniciar Sesión
      </button>
    </form>
  </div>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('toggle-password');
    togglePassword.addEventListener('click', () => {
      const visible = passwordInput.type === 'password';
      passwordInput.type = visible ? 'text' : 'password';
      document.getElementById('password-eye-slash').classList.toggle('hidden', !visible);
      togglePassword.setAttribute('aria-label', visible ? 'Ocultar contraseña' : 'Mostrar contraseña');
      togglePassword.setAttribute('aria-pressed', String(visible));
    });
  </script>
</body>
</html>
