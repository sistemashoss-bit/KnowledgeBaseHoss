{# Modal: editar nombre y foto del grupo (solo grupos). Se incluye desde messaging/index.html. #}
<!-- ── Modal: Editar grupo ──────────────────────────────────────────────── -->
{% if active_conv and active_conv.type == 'group' %}
<div id="modal-edit-group" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-4 sm:p-6 responsive-modal">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-base font-semibold text-gray-900">Editar grupo</h2>
      <button onclick="document.getElementById('modal-edit-group').classList.add('hidden')"
              class="text-gray-400 hover:text-gray-600">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <form method="post" action="/messaging/{{ active_conv.id }}/edit"
          enctype="multipart/form-data" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />

      <!-- Photo -->
      <div class="flex items-center gap-4">
        <div class="relative shrink-0">
          <img id="eg-preview"
               src="{% if active_conv.avatar_key %}{{ group_avatar_url(active_conv.avatar_key) }}{% endif %}"
               class="w-16 h-16 rounded-full object-cover border border-gray-200 {% if not active_conv.avatar_key %}hidden{% endif %}" />
          <div id="eg-placeholder"
               class="w-16 h-16 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center {% if active_conv.avatar_key %}hidden{% endif %}">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"/>
            </svg>
          </div>
        </div>
        <label class="text-xs px-3 py-1.5 rounded-lg border border-gray-200 text-gray-600 hover:bg-gray-50 cursor-pointer transition-colors">
          Cambiar foto
          <input type="file" name="photo" accept="image/*" class="hidden"
                 onchange="var f=this.files[0]; if(!f) return;
                           var url=URL.createObjectURL(f);
                           var img=document.getElementById('eg-preview');
                           img.src=url; img.classList.remove('hidden');
                           document.getElementById('eg-placeholder').classList.add('hidden');" />
        </label>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Nombre del grupo <span class="text-red-500">*</span></label>
        <input id="edit-group-name" type="text" name="name" required value="{{ active_conv.name }}"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
      </div>

      <div class="flex gap-3 justify-end pt-1">
        <button type="button" onclick="document.getElementById('modal-edit-group').classList.add('hidden')"
                class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800">Cancelar</button>
        <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-500 transition-colors">
          Guardar cambios
        </button>
      </div>
    </form>
  </div>
</div>
{% endif %}
