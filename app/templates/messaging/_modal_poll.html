{# Modal: crear encuesta (app/polls; lógica en assets/messaging/composer.js). Se incluye desde messaging/index.html. #}
{% if active_conv %}
<div id="modal-poll" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50">
  <form id="poll-form" data-url="/messaging/{{ active_conv.id }}/poll"
        class="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 p-4 sm:p-6 responsive-modal flex flex-col">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-base font-semibold text-gray-900">Crear encuesta</h2>
      <button type="button" data-poll-close class="text-gray-400 hover:text-gray-600" aria-label="Cerrar">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <label for="poll-question" class="text-xs font-medium text-gray-500">Pregunta</label>
    <input id="poll-question" name="question" type="text" maxlength="300" required autocomplete="off"
           placeholder="Haz una pregunta"
           class="mt-1 w-full px-3 py-2 border border-gray-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-400 placeholder-gray-400" />

    <p class="mt-4 text-xs font-medium text-gray-500">Opciones</p>
    {# Siempre queda un campo vacío al final (hasta 12): se agrega solo al escribir en el último. #}
    <div id="poll-options" class="mt-1 flex flex-col gap-1.5 max-h-60 overflow-y-auto"></div>

    <label class="mt-4 flex items-center justify-between gap-3 cursor-pointer">
      <span class="text-sm text-gray-700">Permitir varias respuestas</span>
      <input type="checkbox" name="multiple" value="true" checked class="w-4 h-4 accent-blue-500" />
    </label>

    <p id="poll-error" class="hidden mt-3 text-xs text-red-600" role="alert"></p>
    <button id="poll-send" type="submit" disabled
            class="mt-4 w-full py-2 bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white rounded-lg text-sm font-medium">Enviar</button>
  </form>
</div>
{% endif %}
