{% extends "base.html" %}
{% block title %}Nuevo ticket — HOSS Conocimiento{% endblock %}

{% block content %}
<div class="flex-1 overflow-y-auto p-4 sm:p-8 bg-gray-50">
  <div class="max-w-2xl mx-auto">

    <a href="/tickets/" class="inline-flex items-center gap-1.5 text-sm text-gray-400 hover:text-gray-600 mb-6 transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
      </svg>
      Volver a Tickets
    </a>

    <form method="post" action="/tickets/" enctype="multipart/form-data"
          class="bg-white rounded-xl border border-gray-200 p-4 sm:p-6 space-y-5"
          x-data="{ kind: '{{ kind }}', files: [] }">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
      <h1 class="text-xl font-bold text-gray-900">Nuevo ticket</h1>

      <fieldset>
        <legend class="block text-xs font-medium text-gray-700 mb-2">Tipo</legend>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="flex gap-3 p-3 rounded-lg border cursor-pointer transition-colors"
                 :class="kind === 'incident' ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'">
            <input type="radio" name="kind" value="incident" x-model="kind" class="mt-0.5 text-blue-600 focus:ring-blue-500" />
            <span>
              <span class="block text-sm font-medium text-gray-800">Incidencia</span>
              <span class="block text-xs text-gray-500">Algo dejó de funcionar o funciona mal</span>
            </span>
          </label>
          <label class="flex gap-3 p-3 rounded-lg border cursor-pointer transition-colors"
                 :class="kind === 'request' ? 'border-blue-500 bg-blue-50' : 'border-gray-200 hover:border-gray-300'">
            <input type="radio" name="kind" value="request" x-model="kind" class="mt-0.5 text-blue-600 focus:ring-blue-500" />
            <span>
              <span class="block text-sm font-medium text-gray-800">Solicitud</span>
              <span class="block text-xs text-gray-500">Pides algo: un acceso, un alta, un cambio</span>
            </span>
          </label>
        </div>
      </fieldset>

      <div>
        <label for="t-dept" class="block text-xs font-medium text-gray-700 mb-1">Departamento que lo atiende</label>
        <select id="t-dept" name="department_id" required
                class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">— Elige un departamento —</option>
          {% for d in departments %}
          <option value="{{ d.id }}" {% if department_id == d.id|string %}selected{% endif %}>{{ d.name }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="t-title" class="block text-xs font-medium text-gray-700 mb-1">Título</label>
        <input id="t-title" type="text" name="title" required maxlength="255"
               :placeholder="kind === 'incident' ? 'Ej. No imprime la impresora de caja 2' : 'Ej. Acceso a la carpeta de Compras'"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>

      <div>
        <label for="t-desc" class="block text-xs font-medium text-gray-700 mb-1">Descripción</label>
        <textarea id="t-desc" name="description" rows="5"
                  :placeholder="kind === 'incident' ? 'Qué pasó, desde cuándo, qué esperabas que pasara y a quién afecta' : 'Qué necesitas, para quién y para cuándo'"
                  class="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-y"></textarea>
      </div>

      <div>
        <label for="t-prio" class="block text-xs font-medium text-gray-700 mb-1">Prioridad</label>
        <select id="t-prio" name="priority"
                class="w-full sm:w-1/2 px-3 py-2 border border-gray-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          {% for p in priorities | reverse %}
          <option value="{{ p }}" {% if p == "medium" %}selected{% endif %}>
            {{ priority_labels[p] }}{% if sla_hours[p] %} · respuesta en {{ "%g" | format(sla_hours[p][0]) }} h{% endif %}
          </option>
          {% endfor %}
        </select>
        <p class="text-[11px] text-gray-400 mt-1">Tiempos de referencia en horas laborales; el departamento puede tener los suyos y ajustar la prioridad.</p>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-700 mb-1">Evidencias (opcional, máx 50 MB por archivo)</label>
        <label class="flex flex-col items-center justify-center w-full py-4 border-2 border-dashed border-gray-300 rounded-lg cursor-pointer hover:border-blue-400 hover:bg-blue-50 transition-colors">
          <span class="text-xs text-gray-500"><span class="font-medium text-blue-600">Seleccionar archivos</span> (capturas, fotos, documentos)</span>
          <input type="file" name="evidences" multiple class="hidden"
                 @change="files = Array.from($event.target.files).map(f => f.name)" />
        </label>
        <ul x-show="files.length" x-cloak class="mt-2 space-y-0.5">
          <template x-for="name in files" :key="name">
            <li class="text-xs text-gray-600 truncate" x-text="name"></li>
          </template>
        </ul>
      </div>

      <div class="flex justify-end gap-2 pt-2">
        <a href="/tickets/" class="px-4 py-2 border border-gray-300 text-gray-600 text-sm rounded-lg hover:bg-gray-50 transition-colors">Cancelar</a>
        <button type="submit"
                class="px-4 py-2 bg-blue-600 text-white text-sm font-medium rounded-lg hover:bg-blue-500 transition-colors">
          Levantar ticket
        </button>
      </div>
    </form>

  </div>
</div>
{% endblock %}
