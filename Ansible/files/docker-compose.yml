version: "3.8"

services:
  knowledge:
    image: ghcr.io/sistemashoss-bit/knowledgebasehoss:latest
    container_name: knowledge
    restart: always
    env_file:
      - .env
    networks:
      - internal

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
    depends_on:
      - knowledge

volumes:
  caddy_data:
  caddy_config:

networks:
  internal:
